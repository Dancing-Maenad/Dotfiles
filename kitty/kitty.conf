# Fonts
font_family       CaskaydiaCove Nerd Font Mono
font_size         12.0
disable_ligatures never
# font_features CaskaydiaCoveNFM-Regular +ss01

# Cursor
cursor_shape              beam
cursor_beam_thickness     1.5
# Smooth trailing cursor (kitty 0.37+)
cursor_trail              3
cursor_trail_decay        0.1 0.4

# Padding & borders
window_padding_width      10 14
window_margin_width       0
single_window_padding_width 0
window_border_width       1pt
draw_minimal_borders      yes
# Dim unfocused splits
inactive_text_alpha       0.6

# Background
background_opacity        0.8
# Works on macOS/KDE; on Hyprland/Niri set blur in the compositor
background_blur           32
# Toggle opacity live with a keybind
dynamic_background_opacity yes

# Tab bar
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       round
# Hide the bar when only one tab
tab_bar_min_tabs          2
tab_title_template        " {index}: {title[:24]} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# Quality of life
scrollback_lines          10000
copy_on_select            clipboard
mouse_hide_wait           3.0
url_style                 curly
detect_urls               yes
confirm_os_window_close   0
enable_audio_bell         no
shell_integration         enabled

# Layouts
enabled_layouts           splits,stack,tall:bias=60

# Keybindings
map ctrl+shift+n>w   launch --location=vsplit --cwd=current
map ctrl+shift+n>h   launch --location=hsplit --cwd=current
map ctrl+shift+n>t   new_tab_with_cwd
map ctrl+shift+s>c   clear_terminal reset active
map ctrl+shift+s>b   show_scrollback
map ctrl+shift+bracketleft  previous_tab
map ctrl+shift+bracketright next_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# Window navigation & resizing
map ctrl+alt+left neighboring_window left
map ctrl+alt+down neighboring_window down
map ctrl+alt+up neighboring_window up
map ctrl+alt+right neighboring_window right
map ctrl+alt+z toggle_layout stack          # zoom a pane
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+o set_background_opacity -0.1
map ctrl+shift+p set_background_opacity +0.1
map ctrl+alt+p set_background_opacity 1.0
map ctrl+alt+o set_background_opacity 0.8

# Handy hint kittens
map ctrl+shift+u kitten hints                              # open URLs
map ctrl+shift+f kitten hints --type path --program -      # grab file paths
map ctrl+shift+h kitten hints --type hash --program @      # git hashes

include themes/noctalia.conf
