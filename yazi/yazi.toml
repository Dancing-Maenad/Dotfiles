
# ~/.config/yazi/yazi.toml
# Yazi 26.9.1 — Fedora + Ghostty + Zsh + Neovim

[mgr]
# Parent | current directory | preview
ratio = [1, 4, 3]

# yazi.toml, under [mgr]
linemode = "size_and_mtime"

# Directories first, then natural alphabetical order
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

# Display last modification time beside each entry
# linemode = "mtime"

# Show dotfiles; use Yazi's filter when a directory is too noisy
show_hidden = true
show_symlink = true

# Keep some breathing room around the cursor
scrolloff = 5

[preview]
# Readable text previews
wrap = "yes"
tab_size = 2

# Image preview bounds and quality
max_width = 1200
max_height = 900
image_delay = 30
image_filter = "triangle"
image_quality = 75

[opener]
# Interactive terminal editor
edit = [
  { run = 'nvim %s', desc = "Neovim", block = true, for = "unix" },
]

[open]
# Prefer Neovim for text files without replacing all default open rules
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.conf", use = "edit" },
  { url = "*.ini", use = "edit" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
