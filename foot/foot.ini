[main]
include=~/.config/foot/themes/noctalia
font = CaskaydiaCove Nerd Font Mono:size=12
pad = 5x5

[colors-dark]
alpha = 1

[cursor]
style = block
blink = yes

[key-bindings]
font-increase = Control+Shift+Up
font-decrease = Control+Shift+Down
font-reset = Control+Shift+Left
scrollback-up-page = Shift+Page_Up
scrollback-down-page = Shift+Page_Down
