## Window rules
# Opacity rules go in a sepate section, all other rules arranged by application

# Apps default to monitor 2
# window_rule=monitor:serial:GBLMTF073880,app_id:^(?!(^kitty-float$|waypaper|^org\.gnome\.Calculator$)$).*

# Helium Browser (tag, monitor)
window_rule=tags:1,monitor:serial:2S6R6HA008726,app_id:helium

# Zen Browser (tag, monitor)
window_rule=tags:1,monitor:serial:2S6R6HA008726,app_id:^zen$

# Discord (tag, monitor)
window_rule=tags:1,monitor:serial:GBLMTF073880,app_id:discord

# Telegram (tag, monitor)
window_rule=tags:1,monitor:serial:GBLMTF073880,app_id:telegram

# Steam(tag, monitor, floating friends list)
window_rule=tags:2,monitor:serial:2S6R6HA008726,app_id:^steam
window_rule=is_floating:1,width:300,height:800,app_id:^steam$,title:^Friends List$

# Games (tag, monitor, full)
window_rule=tags:2,is_fullscreen:1,app_id:^steam_app_.*

# Krita (tag, monitor, floating)
window_rule=tags:4,monitor:serial:2S6R6HA008726,app_id:^krita$
window_rule=is_floating:1,app_id:^krita$,title:(Docker|Palette|Brush).*

# Google Chrome (tag, monitor)
window_rule=tags:2,monitor:serial:GBLMTF073880,app_id:google-chrome

# Noctalia (floating)
window_rule=is_floating:1,app_id:dev.noctalia.Noctalia

# GNOME Calendar (top-right position, floating)
window_rule=is_floating:1,offset_x:100,offset_y:-100,app_id:^org\.gnome\.Calendar$

# Pavucontrol (top-left position, floating)
window_rule=is_floating:1,offset_x:-100,offset_y:-100,app_id:^org\.pulseaudio\.pavucontrol$

# Input Remapper (floating)
window_rule=is_floating:1,app_id:^input-remapper-gtk$

# Policykit (floating)
window_rule=is_floating:1,app_id:^lxqt-policykit-agent$

# Kitty (floating, size)
# window_rule=is_floating:1,width:1800,height:1600,app_id:^kitty-float$

# Kitty (tag)
# window_rule=tags:3,app_id:^kitty-tag$

# Ghostty (floating, size)
window_rule=is_floating:1,width:2000,height:1800,app_id:^com\.ghostty\.float$

# Ghosyty (tag)
window_rule=tags:3,app_id:^com\.ghostty\.tag$

# Waypaper (floating, size)
window_rule=is_floating:1,width:1600,height:1000,app_id:waypaper

# Nautilus (floating)
window_rule=is_floating:1,app_id:nautilus,title:File Operation Progress

# GNOME Calculator (floating, size)
window_rule=is_floating:1,width:400,height:600,app_id:^org\.gnome\.Calculator$

