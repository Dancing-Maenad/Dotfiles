general {
#    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = noctalia msg session lock    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on DP-4 ; hyprctl dispatch dpms on HDMI-A-2  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                               # 5min
    on-timeout = noctalia msg session lock         # lock screen when timeout has passed
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off DP-4 ; hyprctl dispatch dpms off HDMI-A-2 
    on-resume  = hyprctl dispatch dpms on
}
